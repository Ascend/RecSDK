{
  "common_hp": {
    "data_loader_conf": {
    "dataset_name": "kr-rank-dlrm",
    "prefetch_factor": 1,
    "num_workers": 1,
    "num_rerank": 1, # 离线评估时的测试集大小，鉴于一天内的实际交互并不多，32有利于在保留大部分交互的同时加快离线推理速度
    "num_to_sample": 1
  },
  "seed_conf": {
    "global_seed": 42
  },
  "model_conf": {
    "item_embedding_dim": 256,
    "max_sequence_length": 512,
    "num_ratings": 5, # 占位
    "user_embedding_norm": "l2_norm",
    "use_fbgemm": True,
    "linear_activation": "silu",
    "linear_config": "uvqk",
    "norm_type": "layer_norm", ## 可选项"RMS", "layer_norm"
  },
  "train_conf": {
    "lr_scaling": "Linear",
    "learning_rate": 0.00025,
    "train_batch_size": 64,
    "eval_batch_size": 640,  # test_batch_size
    "use_item_l2_norm": True,
    "use_tf32": True,
    "is_recall": False,
    "use_user_embedding": True,
    "use_dynamic_batch": {"enabled": False, "max_tokens": 340}, #动态batchsize特性，token数据根据batchsize设置，默认关闭
  },
 "feature_conf": {
    "date": "20140112", #占位
    "data_delay_1d": True,
    "test_hours": 24,
    "cut_off_bias": 0,
    "infer_ratings_key": "candidate_action_type",
    "infer_items_key": "candidate_item_ids",
    "infer_timestamps_key": "history_timestamps",
    # candidate timestamp,
    "raw_userid_column": "user_id",
    "raw_itemid_column": "history_item_ids",
    "raw_ratings_column": "history_action_type",
    "raw_timestamps_column": "history_timestamps",
    "rating_flag": 0,
    "get_count_from_featuremap": False, #当此处为True时,下方"item_feature_columns"与"user_feature_columns"中的feature_count将被忽略，其值将从feature_map中推断.
    "negative_sample": False, # 取值为0到1之间的float或False。若为float，表示采样一定比例的负样本，若为False则为不采样。
    "item_feature_columns": {
          "candidate_item_ids": {"dim": 32, "feature_count": 6864792, "enabled": True, "dtype": "int"}, # enabled 是否启用该特征。 dytpe int为离散特征，con为连续特征，pref为多值特征。
          "candidate_author_id": {"dim": 32, "feature_count": 1632541, "enabled": True, "dtype": "int"}, # enabled 是否启用该特征。 dytpe int为离散特征，con为连续特征，pref为多值特征。
          "candidate_video_type": {"dim": 32, "feature_count": 3, "enabled": True, "dtype": "int"}, # enabled 是否启用该特征。 dytpe int为离散特征，con为连续特征，pref为多值特征。
          "candidate_visible_status": {"dim": 32, "feature_count": 4, "enabled": True, "dtype": "int"}, # enabled 是否启用该特征。 dytpe int为离散特征，con为连续特征，pref为多值特征。
          "candidate_upload_type": {"dim": 32, "feature_count": 31, "enabled": True, "dtype": "int"}, # enabled 是否启用该特征。 dytpe int为离散特征，con为连续特征，pref为多值特征。
          "candidate_tag": {"dim": 32, "feature_count": 1470, "enabled": True, "dtype": "int"}, # enabled 是否启用该特征。 dytpe int为离散特征，con为连续特征，pref为多值特征。
          "candidate_music_id": {"dim": 32, "feature_count": 4267664, "enabled": True, "dtype": "int"}, # enabled 是否启用该特征。 dytpe int为离散特征，con为连续特征，pref为多值特征。
          "candidate_music_type": {"dim": 32, "feature_count": 7, "enabled": True, "dtype": "int"}, # enabled 是否启用该特征。 dytpe int为离散特征，con为连续特征，pref为多值特征。
    },
    "seq_feature_columns": {
        "history_item_ids": {"length": 512, "dim": 32, "feature_count": 6864792, "enabled": True, "dtype": "int"}
    },
    "user_feature_columns": {},
    }
  },
  "model_cfg": {
    "name": "OneTrans",
    "hp": {
      "verbose": False,
      "num_blocks": 8, # model_layer_Num
      "num_nonseq_feat": 512,
      "d_model": 256,
      "nhead": 4,
      "dropout": 0.1,
      "use_heterogeneous": True,
      "use_pyramid": True,
      "num_pyramid": 50,
      "num_experts": 4,
      "dims": [256, 64],
      "embedding_dropout_rate":0.05,
      "use_nonseq_token": True,
      "use_auto_split":False,
    }
  }
}