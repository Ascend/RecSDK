{
  "common_hp": { 
    "data_loader_conf": {
    "dataset_name": "amazon-recall",
    "prefetch_factor": 8,
    "num_workers": 1,
    "num_rerank": 1 # 离线评估时的测试集大小，鉴于一天内的实际交互并不多，32有利于在保留大部分交互的同时加快离线推理速度
  },
  "seed_conf": {
    "global_seed": 42
  },
  "loss_conf": {
