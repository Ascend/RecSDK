 "feature_conf": {
    "date": "20250301", #占位
    "data_delay_1d": True,
    "test_hours": 24,
    "cut_off_bias": 0,
    "infer_ratings_key": "ratings",
    "infer_items_key": "sequence_item_ids",
    "infer_timestamps_key": "timestamps",
    "raw_userid_column": "user_id", 
    "raw_itemid_column": "sequence_item_ids",
    "raw_ratings_column": "sequence_ratings",
    "raw_timestamps_column": "sequence_timestamps",
